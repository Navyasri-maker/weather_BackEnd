spring.application.name=weather_backend
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${AIVEN_HOST:localhost}:${AIVEN_PORT:3306}/${AIVEN_DATABASE:weather_db}?sslMode=${AIVEN_SSL_MODE:PREFERRED}
spring.datasource.username=${AIVEN_USER:root}
spring.datasource.password=${AIVEN_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

weather.api.key=${WEATHER_API_KEY:}
