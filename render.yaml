services:
  - type: web
    name: weather-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: AIVEN_HOST
        sync: false
      - key: AIVEN_PORT
        sync: false
      - key: AIVEN_DATABASE
        sync: false
      - key: AIVEN_USER
        sync: false
      - key: AIVEN_PASSWORD
        sync: false
      - key: AIVEN_SSL_MODE
        value: REQUIRED
      - key: WEATHER_API_KEY
        sync: false
